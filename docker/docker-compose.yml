volumes:
  postgres_data:

services:
  postgres:
    image: postgres:17
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: food_delivery_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  application:
    image: ${APPLICATION_IMAGE:-marketplace:latest}
    profiles: [production]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/marketplace
      DATABASE_USERNAME: marketplace
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${APPLICATION_HOST_PORT:-8080}:8080"
    secrets:
      - source: jwt-keyring
        target: jwt-keyring.properties
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

secrets:
  jwt-keyring:
    file: ${JWT_KEYRING_FILE:-./secrets/jwt-keyring.properties}
