spring:
  application:
    name: my-marketplace
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml

security:
  jwt:
    secret-key: change-me-change-me-change-me-change-me
    access-token-ttl: 15m
    refresh-token-ttl: 30d
