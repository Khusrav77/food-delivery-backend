databaseChangeLog:
  - changeSet:
      id: 2026-10-19-001-create-user-accounts
      author: shh
      changes:
        - createTable:
            tableName: identity_user_accounts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_identity_user_accounts
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_identity_user_accounts_phone
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - createTable:
            tableName: identity_user_account_roles
            columns:
              - column:
                  name: user_account_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: identity_user_account_roles
            columnNames: user_account_id, role
            constraintName: pk_identity_user_account_roles
        - addForeignKeyConstraint:
            baseTableName: identity_user_account_roles
            baseColumnNames: user_account_id
            referencedTableName: identity_user_accounts
            referencedColumnNames: id
            constraintName: fk_identity_account_roles_account
